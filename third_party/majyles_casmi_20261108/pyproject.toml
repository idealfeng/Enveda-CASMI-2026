[project]
name = "casmi"
version = "0.3.0"
description = "Molecule identification from MS/MS spectra (Kaggle CASMI 2026): library search, analog propagation and a learned ranker"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "ms-entropy>=1.5.2",
    "numpy>=2.4.6",
    "pandas>=3.0.6",
    "pebble>=5.2.2",
    "pyarrow>=25.0.1",
    "rdkit==2026.3.3",
]

[dependency-groups]
# Training, inference and notebooks
experiments = [
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.4",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "scikit-learn>=1.9.1",
]
dev = [
    "kaggle>=2.2.4",
    "pytest>=8.4.0",
]

[tool.uv]
default-groups = ["experiments", "dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["casmi"]
